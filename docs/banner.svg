<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="460" viewBox="0 0 1280 460" role="img" aria-labelledby="title desc">
  <title id="title">AutoModUpdater — ready before you play</title>
  <desc id="desc">A violet update package passes through verification into an amber voxel game scene. Minecraft 1.20.1, Forge 47.4.10, Java 17.</desc>
  <defs>
