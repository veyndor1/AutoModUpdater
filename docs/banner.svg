  <text x="59" y="274" fill="#a9abc3" font-family="Arial,sans-serif" font-size="18">Check the pack. Verify the files.</text>
  <text x="59" y="303" fill="#a9abc3" font-family="Arial,sans-serif" font-size="18">Install together. Keep a backup.</text>
