    <linearGradient id="box" x2="1" y2="1"><stop stop-color="#a899ff"/><stop offset="1" stop-color="#7962d9"/></linearGradient>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#d3c5ff" stroke-width="1.5"/></marker>
  </defs>
  <rect width="1280" height="460" rx="24" fill="#16192c"/>
