plugins { id 'net.minecraftforge.gradle' }
group = rootProject.group
version = rootProject.version
base.archivesName = 'automodupdater-client'
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
minecraft {
    mappings channel: 'official', version: '1.20.1'
    runs {
        client {
            workingDirectory project.file('../run')
            mods { automodupdater { source sourceSets.main } }
        }
        server {
            workingDirectory project.file('../run-server')
            args '--nogui'
            mods { automodupdater { source sourceSets.main } }
        }
    }
}
dependencies { minecraft 'net.minecraftforge:forge:1.20.1-47.4.10' }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') { expand 'version': project.version }
}
jar.finalizedBy 'reobfJar'
tasks.register('obfuscateClient', proguard.gradle.ProGuardTask) {
    dependsOn 'reobfJar'
    configuration rootProject.file('client-proguard.pro')
    injars tasks.jar.archiveFile
    outjars layout.buildDirectory.file('obfuscated/client.jar')
    libraryjars configurations.compileClasspath
    libraryjars fileTree(javaToolchains.compilerFor(java.toolchain).get().metadata.installationPath.dir('jmods')) { include '*.jmod' }
    printmapping rootProject.layout.buildDirectory.file('libs/mapping-client.txt').get().asFile
}
// Acceptance fixture for production Forge; excluded from the updater distribution.
sourceSets {
    acceptanceLibrary
    acceptanceExtra { compileClasspath = sourceSets.main.compileClasspath }
    acceptance {
        compileClasspath = sourceSets.main.compileClasspath + sourceSets.acceptanceLibrary.output
    }
}
tasks.register('acceptanceExtraJar', Jar) {
    from sourceSets.acceptanceExtra.output
    archiveFileName = 'acceptance-extra.jar'
    destinationDirectory = layout.buildDirectory.dir('acceptance')
}
tasks.register('acceptanceLibraryJar', Jar) {
    from sourceSets.acceptanceLibrary.output
    archiveFileName = 'probe-library-1.0.jar'
    destinationDirectory = layout.buildDirectory.dir('acceptance')
    manifest { attributes 'FMLModType': 'GAMELIBRARY', 'Automatic-Module-Name': 'updater.acceptance.library' }
}
tasks.register('acceptanceJar', Jar) {
    dependsOn 'acceptanceLibraryJar'
    from sourceSets.acceptance.output
    from(tasks.acceptanceLibraryJar.archiveFile) { into 'META-INF/jarjar' }
    archiveFileName = 'acceptance-probe.jar'
    destinationDirectory = layout.buildDirectory.dir('acceptance')
    manifest { attributes 'MixinConfigs': 'acceptance.mixins.json' }
}
reobf { acceptanceJar {} }
tasks.acceptanceJar.finalizedBy 'reobfAcceptanceJar'
